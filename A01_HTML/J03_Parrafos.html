<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acapulco</title>
</head>
<body>
    <h1>Instituto Tecnológico de Acapulco</h1>
    Aunque podemos no usar etiquetas como buena práctica se deben usar

    <!-- LA etiqueta para indicar parrafos es la sigueinte -->
    <p>Podemos agregar cualquier texto</p>

    <!-- Insertar retorno de carro en una linea  BR -->
    <p>Esta es una linea <br>Esta es otra linea <br>Dentro del parrafo</p>

     <!-- la regla horizontal HR (es una linea horizontal)-->
    <hr>
    <p>Este es otro parrafo</p>

</body>
</html>
