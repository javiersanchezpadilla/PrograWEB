<!-- Aplicar estilos CSS en HTML (Leccion 14) -->
<!-- Vamos a aplicar un color de fondo azul palido a nuestra hoja -->
<!-- Para esto se agegara style al body  -->
<!-- Para separar los estilos usamos dentro del estilo en punto y coma
    para dar inicio a otro estilo que declararemos y usaremos -->
<!-- Para mostrar los atributos de estilo cuando declaramos un estilo,
    podemos pulsar Control + Espacio y se mostraran mas opciones de estilo,
    esto es, dentro de la declaración de estilos entre estilo y estilo podemos
    oprimir Control Espacio y nos muestra la lista de otras opciones de estilo-->

    
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acapulco</title>
</head>

<!-- Ademas del color azul de fondo cambiaremos el tamaño de la fuente -->
<body style="background-color: powderblue; font-size: 40px; font-family: 'Courier New', Courier, monospace;">
    <h1>Instituto Tecnológico de Acapulco</h1>

    <img src="imagenes/html5.png" alt="no cargo la imagen" 
    title="Pasaste el puntero sobre la imagen">

    <!-- Atributos sobre parrafos -->
     <p title="Texto para el puntero" 
        style="font-size: 20px; font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;">
        Este es un parrafo mostrado en pantalla</p>

</body>
