<!-- Ya vimos como aplicar los estilos globales desde el encabezado del 
 documento html, ahora vamos a colocar estas definiciones en un archivo 
 externo de extensión CSS, para eto lo colocaremos dentro de la carpeta CSS
-->

<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Antes de cerrar la etiqueta de head definimos los estilos globales -->

     globales que queremos modificar, por ejemplo los encabezados -->

            color:white;
