<!-- Muestra como usar una imafen como link en nuestras paginas -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links en HTML</title>
</head>
<body>
    <h1>Instituto Tecnológico de Acapulco</h1>

    <br/>
    <p>Ejemplos para los usos imagen como links</p>
    <br/>

    <!-- Declaramos un link y en lugar de texto definimos una imagen -->
    <a href="https://acapulco.tecnm.mx/">
        <img src="logoTecAca.jpg" alt="Logo Tec Acapulco" width="150px">
    </a>    
    <br/>
    <a href="https://www.google.com/?hl=es">
        <img src="logoGoogle.jpg" alt="Logo Google" width="130px">

    </a>
    
</body>
</html>
