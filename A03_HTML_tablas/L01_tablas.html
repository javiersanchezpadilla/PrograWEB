<!-- Manejo de tablas en HTML 
 Primero veremos las etiquetas y posteriormente aplicaremos estilos css 
 para mejorar su aspecto visual-->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas en HTML</title>
 </head>
 <body>
    <!-- ******************************************************************* -->
    <!-- DECLARAMOS UNA TABLA HTML MEDIANTE LA ETIQUETA TABLE                -->
    <!-- UNA VEZ TERMINADA LA TABLA PODEMOS AGREGAR DENTRO DE TABLE BORDER=1 -->
    <!-- AUNQUE PODEMOS AGREGAR ESTILOS DENTRO DEL DOCUMENTO HTML COMO BUENA -->
    <!-- PRACTICA SE RECOMIENDA HACERLO EN UN ARCHIVO EXTERNO DE ESTILOS CSS -->
    <!--    table border=1                                                   -->
    <table>
         <tr>   <!-- TR Table row declara un nuevo renglon-->
            <th>Nombre</th>     <!-- TH Table head crea una columna dentro -->
            <th>Apellido</th>   <!-- de la tabla-->
            <th>Email</th>
        </tr>
        <tr>
            <td>Juan</td> <!-- TD Table data, define datos para nuestra tabla-->
            <td>Perez</td>
            <td>jperez@mail.com</td>
        </tr>
         <tr>
            <td>MAria</td> 
            <td>Lara</td>
            <td>mlara@mail.com</td>
        </tr>
    </table>
    
 </body>
 </html>
