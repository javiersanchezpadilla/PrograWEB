 
 <!-- AQUI AMPLIAREMOS EL ANCHO DE LA TABLA A TODO LO ANCHO -->
 
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas en HTML</title>
    <link rel="stylesheet" href="L03_estilos.css">
 </head>
 <body>

    <table>
         <tr>   <!-- TR Table row declara un nuevo renglon-->
            <th>Nombre</th>     <!-- TH Table head crea una columna dentro -->
            <th>Apellido</th>   <!-- de la tabla-->
            <th>Email</th>
        </tr>
        <tr>
            <td>Juan</td> <!-- TD Table data, define datos para nuestra tabla-->
            <td>Perez</td>
            <td>jperez@mail.com</td>
        </tr>
         <tr>
            <td>MAria</td> 
            <td>Lara</td>
            <td>mlara@mail.com</td>
        </tr>
    </table>
    
 </body>
 </html>
