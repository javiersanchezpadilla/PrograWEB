<!-- En HTML tenemos tres tipos de Listas
Listas ordenadas       ol  /ol  ORDERED LIST
Listas no ordenadas    ul  /ul  UNORDERED LIST
Listas de definición   dl  /dl  DEFINITION LIST
Elemento de la lista   li  /li  LIST ITEM

Podemos tener listas anidadas, recordar que las listas
puedes mostar cualquier elemento HTML
-->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas en HTML</title>
</head>
<body>
    <h1>Listas no ordenadas</h1>

    <!-- podemos cambiar el estilo de desplegado de la lista, en lugar de mostrar
    un tipo de viñeta podemos cambiarlo por ej. de disc a circle, recordar que
    con CONTROL BARRA podemos acceder a los elementos  -->
    <ul style="list-style-type: lower-greek;">
        <li>Pedro</li>
        <li>Maria
            <ul>
            <li>Telefono 22-2222-2222</li>
            <li>Celular  33-3333-3333</li>
        </ul>
        </li>
        <li>Karla</li>
        <li>Alberto</li>
        <li>Carlos
        <ul>
            <li>Telefono 55-5555-5555</li>
            <li>Celular  66-6666-66666</li>
        </ul>
        </li>

    </ul>
    
</body>
</html>
