<!-- Menú de navegación con listas ORDENADAS
     en este ejempo personalizaremos el texto de inicio de una lista ordendada
     Iniciaremos con la palabra Curso 1... Curso 2...., usando un contador y 
     la funcion couter(nombre), esto mediante el uso de selectores ::before
     ::after-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas ordenadas en HTML</title>
    <link rel="stylesheet" href="M05_estilos.css">
</head>
<body>
    <!-- Podemos en las listas ordenadas indicar el inicio de la lista con type 
         podemos usar números, letras, numeros romanos 
         <ol type="100"> inicia en el valor 100 type="A" con la letra A, type= "I romanos" 
         Sin embargo podemos modificar desde CSS, por ejemplo queremos que cada elemento de mi 
         lista inicie con la palabra curso 1, curso2, etc -->

   <ol type="100">
        <li>Universidad JAVA</li>
        <li>Universidad Python</li>
        <li>Universidad Excel</li>
   </ol>
    
    <h1>Inicio</h1>
