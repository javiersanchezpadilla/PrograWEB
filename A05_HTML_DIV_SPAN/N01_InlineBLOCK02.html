<!-- MANEJO DE ELEMENTOS EN BLOQUE.

     BLOCK: (Elementos en bloque) aplican una nueva linea por cada elemento
     DIV    Para el manejo de los elementos del tipo BLOCK (inician en una
            nueva linea)
     +-------+ 
     |   1   | 
     +-------+ cada camnbio realizado con <DIV> Se inician en una nueva linea
     +-------+
     |   2   |
     +-------+ cada camnbio realizado con <DIV> Se inician en una nueva linea
     +-------+
     |   3   |
     +-------+ cada camnbio realizado con <DIV> Se inician en una nueva linea
     +-------+ 
     |   4   |
     +-------+ cada camnbio realizado con <DIV> Se inician en una nueva linea

-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elementos InLine y Block</title>
</head>
<body>

    <h1>Elemento DIV (block)</h1>

    <!-- CAda elemento se asignará a un bloque distinto -->

    <div>
        <h2>Titulo del div</h2>
        <p>Texto dentro del DIV</p>
   </div>
   <p>Texto fuera del <DIV></DIV></p>
 
</body>
</html>
