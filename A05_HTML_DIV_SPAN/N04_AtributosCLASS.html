<!-- ATRIBUTO CLASS EN HTML

    Continuando con el ejemplo anterios podemos observar que los daots como
    el nombre del lenguaje y el creador son elementos del tipo block, de
    forma automática tiene un margen y un padding, el cual modificaremos
    
    Todos los elementos de bloque agregan un margen y un padding
    -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atributo CLASS en HTML</title>
    <link rel="stylesheet" href="N04_estilos.css">
</head>
<body>
    <h1 class="titulo">Lenguajes de programación</h1>

    <!-- Se define la clase que afectara a la etiqueta, no es necesario el uso 
    del punto, solamente se indica el nombre de la clase, el punto solo se
    usa en la definición de la calse en el archivo de estilos css -->

    <!-- Cuano queremos aplicar varias clases a una etiqueta lo que hacemos
    es separarlas con un espacio en blanco dentro de las comillas dobles
                     Clase 1  Clase 2   Clase 3
    ej.  <div class="tarjeta titulo_uno otra_clase" -->

    <div class="mi_estilo_tarjeta">
        <h2>Java</h2>

    <!-- el elemento span es un elemento inline, por lo que no mandara a otra 
         linea nueva y se va a respetar la misma linea del parrafo-->

        <p><span class="titulo">Creador:</span> James Gosling</p>
    </div>

    <div class="mi_estilo_tarjeta">
        <h2>Python</h2>
        <p><span class="titulo">Creador:</span> Guido van Rossum</p>
    </div>

    <div class="mi_estilo_tarjeta">
        <h2>JavaScript</h2>
        <p><span class="titulo">Creador:</span> Brendan Eich</p>
    </div>


    <div>
        <h2>Resumen de lenguajes de programación</h2>
        <p>www.mataweb.com.mx</p>
    </div>
    
</body>
</html>
