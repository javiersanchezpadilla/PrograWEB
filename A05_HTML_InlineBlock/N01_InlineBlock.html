<!-- Se van a manejar los elementos en linea y en bloque
     SPAN   Para los elementos en linea se van a manejar los elemenos
     DIV    Para los elementos en bloque

     lo anterior quiere decir que para los elementos en linea se va a usar
     la etiqueta span y para los elementos en bloque la etiquete div

     DIFERENCIAS ENTRE LOS ELEMENTO INLINE Y BLOCK

     BLOCK: (Elementos en bloque) aplican una nueva linea por cada elemento
     +-------+ 
     |   1   | 
     +-------+ 
     +-------+
     |   2   |
     +-------+
     +-------+
     |   3   |
     +-------+
     +-------+
     |   4   |
     +-------+

    INLINE: (Elementos en linea) no aplican nueva linea al final del elemento
     +-------+ +-----+ +-------------------+ +--+ +-----------+ +-------+
     |   1   | |  2  | |        3          | |4 | |    5      | |   6   |
     +-------+ +-----+ +-------------------+ +--+ +-----------+ +-------+
     +---------------------------------------------------+ +-----+
     |                          6                        | |  7  |
     +---------------------------------------------------+ +-----+

-->
