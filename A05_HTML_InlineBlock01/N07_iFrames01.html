<!-- CARGANDO UN DOCUMENTO HTML EN UN I-FRAME
 
Los iFrames en HTML son marcos html donde podemos colocar información HTML 
a su vez como otras páginas HTML, sitios WEB directamente, videos, documentos, 
etc.
Mediante el uso de iframe, vamos a poder insertar otros elementos HTML -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manejo de i-Frame</title>
    <link rel="stylesheet" href="N07_estilos.css">
</head>
<body>
    <h1 class="titulo">Uso de iframe en HTML</h1>
    <iframe src="N07_texto.html" frameborder="0" class="marco"></iframe>

    
</body>
</html>
