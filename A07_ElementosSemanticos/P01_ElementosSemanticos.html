<!-- ELEMENTOS SEMANTICOS EN HTML 
 
    Son las mejoras que contiene HTML 5.
    Los elementos semanticos definen correctamente los elementos dentro de una
    página HTML
     
    <section>   Se incorpor esta etiqueta que puede reemplazar a <DIV> para 
                identificar las partes dentro de una página WEB
    <article>   Permite.

    <aside>     Permite definir barras de desplazamiento laterales.
    <header> <footer> No permite definir una cabecera y un pie de página
    <hgroup>    PAra agrupar varios titulos desde h1 hasta h6
    <nav>       nos permite definir barras de navegación ,pueden ser las que se
                necesiten.
    
    DOM     Document Object Model
     -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elementos semanticos</title>
</head>
<body>

    <header>
        <p>Cabecero</p>
    </header>
    <nav>
        <p>Barra Navegación</p>
    </nav>

    <section>
        <p>Sección</p>
        <article>article>Artículo 1</article>
        <article>article>Artículo 2</article>
    </section>
    <footer>
        <p>Pie de página</p>
    </footer>
   
</body>
</html>
