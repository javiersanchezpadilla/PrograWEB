<!-- INTRODUCCIÓN A CSS ELEMENTOS INLINE CSS

    Básicamente, CSS nos va a permitir mejorar visualmente nuestras páginas 
    HTML.
    Así que por un lado, HTML tiene como objetivo agregar la estructura de 
    nuestra página web y por otro lado, CSS va a mejorar visualmente cada una 
    de estas etiquetas HTML.
    Así que vamos a ver a detalle cada elemento CSS que podemos utilizar para 
    mejorar visualmente nuestras páginas web. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introcucción a CSS</title>
</head>
<body>

    <!-- INLINE CSS A esta forma de aplicar los estilos se le conoce como  -->
    <!-- El problema inicia cuando quermeos aplicar estos mismos estilos en 
         otra etiqueta, tendriamos que copiar y pegar en cada elemento para 
         tener exactamente lo mismo, esto no es una bueba práctica, por eso CSS
         implemente el concepto de selector, esto permite definir los elemento
         a los que queremos aplicar los estilos (esto gracias al selector) -->
    <h1 style="color: blue; text-align: center; font-size: 100px;">Curso de Programación WEB</h1>

</body>
</html>
