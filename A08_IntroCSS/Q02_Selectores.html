<!-- SELECTORES EN CSS 
    
    Vamos a definir los estilos dentro de nuestro documento HTML
    definiendo selectores a los cuales aplicaremos propiedades que
    aplicarán a los mismos selectores, tenemos que elimiar los estilos
    definidos dentro de la etiqueta <h1> para que puedan tomar efecto
    los definidos en el selector, los elemento INLINE tienen prioridad
    sobre cualquier otro elemento definido 

-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creación de selectores</title>

    <!-- Aqui agregamos los selectores con sus estilos -->
     <style>
        h1 { /* h1 es el selector que permitira definir los estilos
                para todos lo elementos del tipo h1 */
            color: red;
            text-align: right;
        }
     </style>
</head>


<body>
    <h1>Curso de Programación WEB</h1>

    
</body>
</html>
