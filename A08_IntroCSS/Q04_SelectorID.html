<!-- SELECTOR ID EN CSS 
   Nos va a permitir modificar un elemento HTML que es unico 
   en nuestra página, y aunque se puede aplicar a otros elementos
   no es lo recomendable
-->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Q04_estilos.css">
 </head>
 <body>
   <!-- La idea de la definición de este elemento ID, es que sea único y no se 
   aplique a ningún otro elemento en la página -->
   <h1 id="para_el_titulo">Este es un elemento que se va a modificar de forma unica</h1>
    
 </body>
 </html>
