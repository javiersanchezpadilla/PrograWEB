<!-- A diferencia de un selector del tipo ID, una clase puede utiliziarse
cuantas veces lo necesitemos dentro del documento HTML -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manejo de clases</title>
    <link rel="stylesheet" href="Q05_estilos.css">
</head>
<body>
    <h1 id="el_titulo">Tecnológico Nacional de México Campus Acapulco</h1>

    <!-- Una clase la podemos aplicar a varios elementos -->

    <p class="centrar texto_grande">Iniciando el curso CSS</p>
    <p class="centrar">www.tecnologico.edu.mx</p>
    
</body>
</html>
