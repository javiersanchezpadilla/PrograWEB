<!-- MANEJO DEL ANCHO DE LOS BORDES 
    
    Podemos usar la instrucción simplificada 
    
    border:  pixeles  tipo_de_borde  color ;

    Podemos usar las instruccionesa a una, la ventaja aqui es
    que al definir una instrucción especifica podemos incluso
    definir caracteristicas distintas para cada uno de los bordes
    borde superior, borde derecho, borde inferior y borde izquierdo


-->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipos de bordes</title>
    <link rel="stylesheet" href="R04_estilos.css">
 </head>
 <body>
        <h1>Bordes en CSS</h1>

        <h2 class="punteado">Borde punteado (dotted)</h2>
        <h2 class="discontinuo">Borde discontinuo</h2>
        <h2 class="solido">Borde solido</h2>
        <h2 class="doble">Borde doble</h2>
        <h2 class="surco">Borde con surco</h2>
        <h2 class="cresta">Borde con cresta</h2>
        <h2 class="recuadro">Borde con recuaadro</h2>
        <h2 class="outset">Borde outset</h2>
        <h2 class="sin_borde">Sin Borde</h2>
        <h2 class="oculto">Borde oculto</h2>
        <h2 class="mixto">Borde mixto</h2>

 </body>
 </html>
