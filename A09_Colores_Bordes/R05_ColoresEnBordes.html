<!-- MANEJO DEL COLOR EN LOS BORDES 
    
    Podemos declarar colores para los bordes usando la propiedad 
    BORDER-COLOR el cual nos permite el manejo de distintos sistemas
    de color incluyendo el manejo de transparencia, cuando seleccionamos
    un color y dejamos el puntero del raton sobre el color se habilita
    una paleta de colores, podemos hacer lo siguiente:

    1. podemos dar clic en la barra del titulo de la paleta y así cambiar
       el sistema de color (nombre, hexadecimal, HSL).
    2. Podemos dar clic sobre la paleta de colores para que en función del
       sistema de color seleccionado nos de los valores del color

    ALTERNATIVO: existen dos barras del lado derecho de la paleta de color
    una sube el tono y la primera permite modificar la transparencia, lo que
    quiere decir que habilita el canal alpha
-->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipos de bordes</title>
    <link rel="stylesheet" href="R05_estilos.css">
 </head>
 <body>
        <h1>Bordes en CSS</h1>

        <h2 class="punteado">Borde punteado (dotted)</h2>
        <h2 class="discontinuo">Borde discontinuo</h2>
        <h2 class="solido">Borde solido</h2>
        <h2 class="doble">Borde doble</h2>
        <h2 class="surco">Borde con surco</h2>
        <h2 class="cresta">Borde con cresta</h2>
        <h2 class="recuadro">Borde con recuaadro</h2>
        <h2 class="outset">Borde outset</h2>
        <h2 class="sin_borde">Sin Borde</h2>
        <h2 class="oculto">Borde oculto</h2>
        <h2 class="mixto">Borde mixto</h2>

 </body>
 </html>
