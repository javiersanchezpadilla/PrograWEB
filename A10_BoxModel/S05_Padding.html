<!-- MANEJO DE PADDING EN CSS

    Entre el BORDE y el CONTENIDO tenemos el concepto de padding

    +-----------------------------------------------------------------------+
    |              MARGIN                       Top                         |
    |   +---------------------------------------------------------------+   |
    |   |               BORDER                  Top                     |   |
    |   |   +-------------------------------------------------------+   |   |
    |   |   |           <<<<<PADDING>>>>>>>     Top                 |   |   |  
    | L | L | L +-----------------------------------------------+ R | R | R |
    | e | e | e |    CONTENTIDO HTML (Texto, imagenes, etc)     | i | i | i |
    | f | f | f |                                               | g | g | g |
    | t | t | t +-----------------------------------------------+ h | h | h |
    |   |   |                                   Bottom            t | t | t |
    |   |   +-------------------------------------------------------+   |   |
    |   |                                       Botom                   |   |
    |   +---------------------------------------------------------------+   |
    |                                           Botom                       |
    +-----------------------------------------------------------------------+

    y podemos especificar un valor para la parte superior, decha, inferior e
    izquierda

-->
 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box model en CSS</title>
    <link rel="stylesheet" href="S05_estilos.css">
</head>
<body>
    <h1>Box Model CSS</h1>
    <div>Mi contenido</div>
</body>
</html>
