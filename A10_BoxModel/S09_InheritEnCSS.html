<!-- PROPIEDAD INHERIT EN CSS

    El concepto de herencia lo aplicaremos de elementos HTML externos
    a elementos HTML internos, por ejemplo dentro del <div> se agregara
    un parrafo para no dejar sueltos los elementos 

    Antes:
        <div>Mi contenido</div>
    
    Nuevo cambio (se agrego el parrafo):
        <div><p>Mi contenido</p></div>


-->

 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box model en CSS</title>
    <link rel="stylesheet" href="S09_estilos.css">
</head>
<body>
    <h1>Box Model CSS</h1>
    <div><p class="interno">Mi contenido</p></div>
</body>
</html>
