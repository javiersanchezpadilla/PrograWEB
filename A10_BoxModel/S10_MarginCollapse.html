<!-- CONCEPTO DE MARGIN COLLAPSE EN CSS

    Vamos a ver ahora el concepto de Margin collapse cuando tenemos más de 
    una caja (ELEMENTO <DIV>), Vamos a ver que el comportamiento del margen 
    superior e inferior puede diferir de lo que esperamos.
    Esto no ocurre con el margen izquierdo y derecho, Únicamente va a ocurrir 
    este fenómeno en el margen superior e inferior, Vamos a ver a qué nos 
    referimos con este concepto de margin colapsen.
    Lo primero que vamos a hacer es crear otro elemento de tipo div.

-->

 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box model en CSS</title>
    <link rel="stylesheet" href="S10_estilos.css">
</head>
<body>
    <h1>Box Model CSS</h1>
    <div class="caja1"><p>Mi contenido UNO</p></div>
    <div class="caja2"><p>Mi contenido DOS</p></div>
</body>
</html>
