<!-- Manejo de colores en CSS 
 
   Ahora vamos a definir colores usando RGB (Red Green Blue)
   los valores a usar van desde 0 hast 255

   rgb(0, 0, 0) Negro       rgb(255, 255, 255) Blanco
   rgb(255, 0, 0) Rojo      rgb(0, 255, 0) Verde
   rgb(0, 0, 255) Azul      rgb(255, 255, 0) Amarillo
-->

 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manejo de colores en CSS</title>
    <link rel="stylesheet" href="S21_estilos.css">
 </head>
 <body>
   <h1>Colores en CSS</h1>

   <div class="caja rojo">
      <p>Color por nombre HTML</p>
   </div>
    
   <div class="caja rosa">
      <p>Color por nombre HTML</p>
   </div>

   <div class="caja rgb">
      <p>Color por RGB (red, green, blue)</p>
    </div>

    <!-- Como hay un color blanco de fondo se mezcla el 
     morado con el fondo blanco -->
   <div class="caja rgba">
      <p>Color por RGB (red, green, blue)</p>
   </div>


 </body>
 </html>
