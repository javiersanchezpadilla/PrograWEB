<!-- FUENTES EN CSS

     Sin embargo, una clasificación básica son las familias del tipo de fuente SERIF y 
     las familias de tipo de fuentes SANS SERIF.
     el tipo de fuente SERIF tiene redondeadas las esquinas, así que todas esas fuentes
     tienen las esquinas con un redondeo.
     En cambio, las fuentes de tipo SANS SERIF, no tienen ningún redondeos o más simplificadas.
     Son fuentes más minimalistas, más simplificadas.
     Las fuentes de tipo SERIF se utilizan para dar más formalidad y elegancia, en cambio, 
     los tipos de fuente SANS SERIF se utilizan para cuestiones más modernas y minimalistas.
     En ese ejemplo vamos a ver algunas fuentes de tipo SERIF y algunos ejemplos de tipo 
     SANS SERIF
     
     Times New Roman        SERIF
     Fuente Georgia         SERIF
     Fuente Arial           SANS SERIF
     Fuente Verdana         SANS SERIF
     Courier New            monospace (aspecto de una maquina de esribir)
     Lucida Handwritting    cursiva          
     
     Importante!!! Existen mas fuentes per solo se trabajaran estos de momento -->

     <!DOCTYPE html>
     <html lang="en">
     <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Manejo de fuentes en CSS</title>
        <link rel="stylesheet" href="S41_estilos.css">
     </head>
     <body>
        <h1>Fuentes en CSS.</h1>

        <!-- Fuentes del tipo SERIF         -->
        <div class="caja fuente_serif">
            <p class="fuente_times">Times New Roman <br/>(serif)</p>
        </div>
        <div class="caja fuente_serif">
            <p class="fuente_georgia">Fuente Georgia <br/>(serif)</p>
        </div>

        <!-- Fuentes del tipo SANS-SERIF -->
        <div class="caja sans-serif">
            <p class="fuente_arial">Fuente Arial <br/>(sans-serif)</p>
        </div>
        <div class="caja sans-serif">
            <p class="fuente_verdana">Fuente Verdana <br/>(sans-serif)</p>
        </div>

        <!-- Fuentes del tipo MONOSPACE Simulan un maquina de escribir -->
        <div class="caja monospace">
            <p class="fuente_courier">Corurier NEw <br/>(monospace)</p>
        </div>

        <!-- Fuentes del tipo cursiva simula la escritura a mano -->
        <div class="caja cursiva">
            <p class="fuente_lucida">Fuente Lucida Handwritting <br/>(cursiva)</p>
        </div>


     </body>
     </html>
