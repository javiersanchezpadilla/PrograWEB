<!-- FUENTES DE GOOGLE (GOOGLE FONTS) PARA CSS

Ya vimos los tipos de familias de fuentes más comunes que tenemos para HTML y CSS
Pero si no queremos utilizar ninguna de estas fuentes, tenemos más opciones de 
fuentes para trabajar.
Un ejemplo son las fuentes de Google, a traves del buscador escribimos
"Google Fonts" (https://fonts.google.com/)

Aquí tenemos bastantes fuentes que podemos utilizar para nuestros proyectos y son 
fuentes que podemos utilizar de manera gratuita, sin embargo, lo único que debemos 
de considerar es que al usar este tipo de fuentes, PUEDE TARDAR UN POCO MÁS NUESTRA 
PÁGINA PARA CARGARSE, ya que se va a utilizar directamente una fuente desde Internet
A menos que descarguemos esta fuente y la pongamos en nuestra aplicación web.

DEntro de la página buscamos (existe un buscador de fuentes) el tipo de fuente que 
queremos utilizar, por ejemplo el tipo "sofia", la opción para el uso de las fuentes
será mediante la opcion @import para pegar dentro del archivo CSS y usar directamente
el estilo en las etiquetas (ver archivo CSS)
-->

     <!DOCTYPE html>
     <html lang="en">
     <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Manejo de fuentes en CSS</title>
        <link rel="stylesheet" href="S44_estilos.css">

     </head>
     <body>
        <h1 class="font-sofia">Fuentes de Google Sofia.</h1>

                <!-- Mas fuentes externas de google -->
        <div class="caja fuente_fondo">
            <p class="font-roboto">Fuente Roboto</p>
        </div>

        <div class="caja fuente_fondo">
            <p class="font-eagle">Fuente Eagle</p>
        </div>

        <div class="caja fuente_fondo">
            <p class="font-edu-austria">Font Edu Austria</p>
        </div>

        <div class="caja fuente_fondo">
            <p class="font-lobster">Fuente Lobster</p>
        </div>

        <div class="caja fuente_fondo">
            <p class="font-zen-kurenaido">Fuente font-zen-kurenaido</p>
        </div>

     </body>
     </html>
