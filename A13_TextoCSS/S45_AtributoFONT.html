     <!DOCTYPE html>
     <html lang="en">
     <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Manejo de fuentes en CSS</title>
        <link rel="stylesheet" href="S45_estilos.css">

     </head>
     <body>
        <h1 class="font-sofia">Fuentes de Google Sofia.</h1>

                <!-- Mas fuentes externas de google -->

        <div class="caja fuente_fondo">

        <div class="caja fuente_fondo">

        <div class="caja fuente_fondo">

        <div class="caja fuente_fondo">
