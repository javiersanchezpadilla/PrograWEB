<!-- MANEJO DE ICONOS DE BOOTSTRAP EN CSS

Vamos a trabajar con los iconos de BootStrap
Existen varias soluciones para el manejo de iconos en aplicaciones web y una 
de las más populares son los iconos de BootStrap.
BootStrap es una tecnología que nos permite facilitar la creación de sitios 
web, sobretodo creación de sitios web responsive y ademas nos va a permitir 
simplificar el uso de CSS. 

En el buscador tecleamos "iconos boostrap" (https://icons.getbootstrap.com/)

Tenemos varias formas utilizar estos iconos, en la página podemos ver todos
los iconos que podemos utilizar, podemos utilizarlos en nuestras aplicaciones 
web y podemos hacer, entre otras cosas, sobre el icono seleccionado, modificar
su tamaño y también cambiar su color.

En cada icono podemos observar la opcion SVG
SVG significa Scalable Vector Graphics (Gráficos Vectoriales Escalables). 
A diferencia de una foto normal (como un JPG o PNG) que está hecha de pixeles 
y se ve borrosa si la haces muy grande, un SVG está hecho de instrucciones 
matemáticas (dibuja una línea aquí, pinta un círculo allá). Por eso nunca 
pierden calidad, sin importar si los pones chiquitos en un botón o gigantes 
en una pantalla de cine.

Dentro del documento html se muestran las 3 formas de usar un SVG
-----------------------------------------------------------------
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iconos en CSS</title>
    <link rel="stylesheet" href="S50_estilos.css">
    
</svg>
</head>
<body>
    <h1>Iconos de BOOTSTRAP</h1>
    <div>
        <!-- FORMA 1. Como si fuera una imagen normal (La más sencilla)
             Cuando descargas el archivo SVG desde la página de Bootstrap 
             (o cualquier otro lado), lo guardas en tu carpeta y lo puedes 
             llamar directamente con la etiqueta <img> de HTML, tal cual 
             harías con una foto 
             (Nosotros definimos el alto y ancho del icono vectorial)
             width="40" height="40"
             vertical-align es para centrar el texto con la imagen del icono -->
        <p>
            <img src="IconosBootstrap/android2.svg" alt="Andoid" width="40" height="40">
            Está es la primera forma de manejar los iconos
        </p>
    </div>
+    <div>
        <p>
            <img src="IconosBootstrap/arrow-right-circle-fill.svg" alt="Andoid" width="40" height="40"">
            Flecha Derecha
        </p>
    </div>


        <!-- FORMA 2. Copiar y pegar el código directamente (La favorita de 
             los diseñadores) Cuando le das clic al botón de copiar SVG en la 
             página de Bootstrap, te llevas un bloque de código que empieza 
             con <svg ...> y termina con </svg>. Lo único que haces es pegarlo 
             tal cual en tu HTML: -->
    <div>

        <!-- FORMA 3. Usarlo como fondo en CSS, También puedes mandar a llamar 
             un SVG directamente desde tus hojas de estilo CSS como si fuera

        <button class="mi-boton">Otro boton</button>
