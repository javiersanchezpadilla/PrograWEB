<!-- MANEJO DE ICONOS EN GOOGLE

Buscamos "icons google"    (https://fonts.google.com/icons)
Actualmente los iconos de google son manejados como un font
Sin embargo es mucho mas sencillo el manejo de la versión 
SVG, ya sea bajar el icono vectorizado o enlazar con la 
etiqueta <svg>
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iconos en CSS</title>
    <link rel="stylesheet" href="S51_estilos.css">
</svg>
</head>
<body>
    <h1>Iconos de GOOGLE</h1>
    <div>
        <!-- FORMA 1. Como si fuera una imagen normal (La más sencilla)
             Cuando descargas el archivo SVG desde la página de google 
             (o cualquier otro lado), lo guardas en tu carpeta y lo puedes 
             llamar directamente con la etiqueta <img> de HTML, tal cual 
             harías con una foto 
             (Nosotros definimos el alto y ancho del icono vectorial)
             width="40" height="40" -->
        <p>
            <img src="IconosGoogle/settings_24dp_1F1F1F_FILL0_wght400_GRAD0_opsz24.svg" alt="Andoid" width="40" height="40">
            Está es la primera forma de manejar los iconos
        </p>
    </div>

    <div>
        <p>
            <img src="IconosGoogle/check_circle_24dp_1F1F1F_FILL0_wght400_GRAD0_opsz24.svg" alt="Andoid" width="40" height="40">
            Operación realizada con éxito
        </p>
    </div>

        <!-- FORMA 2. Copiar y pegar el código directamente (La favorita de 
             los diseñadores) Cuando le das clic al botón de copiar SVG en la 
             página de Google, te llevas un bloque de código que empieza 
             con <svg ...> y termina con </svg>. Lo único que haces es pegarlo 
             tal cual en tu HTML: -->
    <div>

        Una estrella
    </button>
