<!-- PROPIEDAD DISPLAY NONE EN CSS

La propiedad Display también nos sirve para mostrar u ocultar un elemento 
HTML por default, elementos HTML conforme los vamos agregando se van 
mostrando, pero también podemos configurar la propiedad display para 
ocultarlos. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etiqueta Display en CSS</title>
    <link rel="stylesheet" href="T02_estilos.css">
</head>
<body>
    <!-- Se ocultara el encabezado y no ocupara espacio en pantalla -->
    <h1>Encabezado del tipo h1</h1>
    <div>Elemento del tipo div</div>

    <!-- Se oculataran los parrafos pero el espacio se respetara en pantalla -->
    <p>Elemento del tipo parrafo</p>
    <p>Este es un texto <span>con un salto de linea</span></p>


    <a href="#">Link 1</a>
    <a href="#">Link 2</a>
    <a href="#">Link 3</a>
    
     <ul>
        <li>Articulo 1</li>
        <li>Articulo 2</li>
        <li>Articulo 3</li>
        <li>Articulo 4</li>
     </ul>
</body>
</html>
