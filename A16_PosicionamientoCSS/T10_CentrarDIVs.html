<!-- CENTRAR ELEMENTOS DEL TIPO DIV EN CSS 
 
Recordemos que los elementos del tipo DIV son del tipo BLOCK, así que ocupan 
todo el ancho disponible de la ventana.
Pero qué pasa si queremos que no ocupen todo el ancho de la ventana, sino 
que solamente ocupen cierta parte de la pantalla y entonces, dependiendo del 
tamaño que ocupen, centrar este elemento de tipo <div>

-->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centrar elementos Div</title>
    <link rel="stylesheet" href="T10_estilos.css">
 </head>
 <body>
    <h1>Centrar elementos del tipo Div</h1>
    <div>Elemento del tipo div</div>
 </body>
 </html>
