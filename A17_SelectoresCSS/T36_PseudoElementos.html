<!-- PSEUDO ELEMENTO EN CSS
 
Básicamente los pseudo elementos nos permiten agregar un estilo a ciertos 
elementos HTML, sin embargo, esos estilos que vamos a agregar son de maneras 
más particulares de lo que hemos visto anteriormente.
Por ejemplo, podemos agregar un cierto elemento antes o después de un elemento 
seleccionado de tipo HTML, o también, podemos modificar la primer letra de 
un párrafo. la primer línea, etc. así que, dependiendo de lo que necesitemos 
modificar, tenemos varios elementos que podemos utilizar en CSS.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo elementos en CSS</title>
    <link rel="stylesheet" href="T36_estilos.css">
</head>
<body>
    <h1>Pseudo elementos en CSS</h1>

    <div class="contenedor">
        <p>Selecciona el texto</p>
        <!-- Vamos a usar small-caps solo para la primer linea de cada parrafo-->
        <p>Quis nisi laboris qui voluptate nulla ullamco Lorem adipisicing sint dolore ipsum.</p>

    </div>
    <p>Segundo parrafo sin efecto</p>



</body>
</html>
