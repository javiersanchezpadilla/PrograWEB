<!-- TRANSPARENCIA EN IMAGENES EN CSS
 
Vamos a realizar el siguiente ejemplo en el cual, si pasamos sobre imagen el
puntero del raton vamos a cambiar la opacidad del elemento, es decir, la 
cantidad de transparencia que podemos aplicar sobre cierto elemento HTML.
Vamos a aplicar de manera inicial un 50 por ciento de transparencia a la
imagen de HTML, y cuando nos coloquemos sobre la imagen, cambiará el valor 
de opacidad al 100 por ciento, esto permitira visualizar por completo la 
imagen, si cambiáramos de valor de opacidad a cero, ya no se observaría la 
imagen, ya que tendríamos una transparencia del 100 por ciento.
 -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transparencia en CSS</title>
    <link rel="stylesheet" href="T37_estilos.css">
</head>
<body>
    <h1>Transparencia en CSS</h1>
    <div class="contenedor">
        <p>pasa por encima de la imagen</p>
        <img src="../A16_PosicionamientoCSS/imagenes/images.png" alt="Logo HTML">

    </div>
    
</body>
</html>
